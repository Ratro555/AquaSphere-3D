<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Реалистичный Сферический Аквариум</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #030914;
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
            background: radial-gradient(circle at 50% 45%, #0c2b4e 0%, #041022 55%, #01050c 100%);
        }

        /* Glassmorphism UI */
        .glass-panel {
            background: rgba(13, 31, 58, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .btn-action {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.35);
        }
        .btn-action:active {
            transform: translateY(0);
        }

        /* Подсказка */
        .fade-out {
            animation: fadeOut 4s forwards;
            animation-delay: 4s;
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; pointer-events: none; }
        }
    </style>
</head>
<body class="text-slate-100">

    <!-- 3D Контейнер -->
    <div id="canvas-container"></div>

    <!-- Верхний заголовок и подсказка -->
    <div class="fixed top-4 left-4 right-4 flex justify-between items-start pointer-events-none z-10">
        <div class="glass-panel px-5 py-3 rounded-2xl pointer-events-auto flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-cyan-400 animate-pulse"></div>
            <div>
                <h1 class="font-bold text-base sm:text-lg tracking-wide text-white leading-tight">AquaSphere 3D</h1>
                <p class="text-xs text-cyan-200/80">Интерактивный био-аквариум</p>
            </div>
        </div>

        <div id="hint-box" class="glass-panel px-4 py-2 rounded-xl text-xs sm:text-sm text-cyan-100/90 hidden md:flex items-center gap-2 fade-out">
            <span>🖱️ Вращение: ЛКМ / Свайп</span>
            <span class="opacity-40">|</span>
            <span>🔍 Зум: Колесико</span>
            <span class="opacity-40">|</span>
            <span>✨ Клик по воде — покормить</span>
        </div>
    </div>

    <!-- Нижняя панель управления -->
    <div class="fixed bottom-5 left-1/2 -translate-x-1/2 z-10 w-[95%] max-w-2xl">
        <div class="glass-panel p-2 sm:p-3 rounded-2xl flex flex-wrap items-center justify-between gap-2">
            
            <div class="flex items-center gap-1.5 sm:gap-2 flex-wrap">
                <!-- Покормить -->
                <button id="btn-feed" class="btn-action flex items-center gap-2 px-3.5 py-2.5 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 border border-amber-400/30 text-amber-200 text-xs sm:text-sm font-medium">
                    <span>🪱</span>
                    <span>Покормить</span>
                </button>

                <!-- Добавить рыбку -->
                <button id="btn-add-fish" class="btn-action flex items-center gap-2 px-3.5 py-2.5 rounded-xl bg-cyan-500/20 hover:bg-cyan-500/30 border border-cyan-400/30 text-cyan-200 text-xs sm:text-sm font-medium">
                    <span>🐠</span>
                    <span>+ Рыбка (<span id="fish-count">8</span>)</span>
                </button>

                <!-- Запустить Акулу -->
                <button id="btn-shark" class="btn-action flex items-center gap-2 px-3.5 py-2.5 rounded-xl bg-red-500/20 hover:bg-red-500/30 border border-red-400/30 text-red-200 text-xs sm:text-sm font-medium">
                    <span>🦈</span>
                    <span id="shark-state">+ Акула</span>
                </button>

                <!-- Пузырьки -->
                <button id="btn-bubbles" class="btn-action flex items-center gap-2 px-3.5 py-2.5 rounded-xl bg-blue-500/20 hover:bg-blue-500/30 border border-blue-400/30 text-blue-200 text-xs sm:text-sm font-medium">
                    <span>🫧</span>
                    <span class="hidden sm:inline">Аэрация:</span>
                    <span id="bubble-state">Макс</span>
                </button>

                <!-- Свет -->
                <button id="btn-light" class="btn-action flex items-center gap-2 px-3.5 py-2.5 rounded-xl bg-purple-500/20 hover:bg-purple-500/30 border border-purple-400/30 text-purple-200 text-xs sm:text-sm font-medium">
                    <span>💡</span>
                    <span class="hidden sm:inline">Режим:</span>
                    <span id="light-state">День</span>
                </button>
            </div>

            <!-- Кнопка скачивания HTML файла -->
            <button id="btn-download" class="btn-action ml-auto flex items-center gap-2 px-4 py-2.5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-semibold text-xs sm:text-sm shadow-lg">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                </svg>
                <span>Скачать HTML</span>
            </button>
        </div>
    </div>

    <!-- Уведомление -->
    <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 glass-panel px-5 py-2.5 rounded-xl text-sm text-emerald-300 font-medium opacity-0 pointer-events-none transition-opacity duration-300">
        Файл успешно подготовлен к скачиванию!
    </div>

    <script>
        // ==========================================
        // ИНИЦИАЛИЗАЦИЯ СЦЕНЫ И КАМЕРЫ
        // ==========================================
        let scene, camera, renderer;
        let aquariumGroup;
        const BOWL_RADIUS = 10;
        const WATER_LIMIT = 8.4; // Радиус, внутри которого плавают рыбки

        const fishes = [];
        const seaweeds = [];
        const corals = [];
        const foodParticles = [];
        const biteEffects = [];
        let shark = null;
        let bubbleSystem, bubbleData = [];
        let bubbleIntensity = 2; // 0: выкл, 1: норма, 2: макс
        let lightingMode = 0; // 0: День, 1: Закат, 2: Неон-ночь

        // Управление камерой
        let isDragging = false;
        let prevMouse = { x: 0, y: 0 };
        let spherical = { theta: 0, phi: Math.PI / 2.05, radius: 26.5 };
        let targetSpherical = { theta: 0, phi: Math.PI / 2.05, radius: 26.5 };
        let autoRotate = true;

        // Источники света для переключения режимов
        let topLight, rimLightLeft, rimLightRight, bottomGlowLight, ambientLight;

        // ==========================================
        // ПРОЦЕДУРНАЯ ГЕНЕРАЦИЯ ТЕКСТУР РЫБОК (Высокая детализация)
        // ==========================================
        function createFishSkinTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // Функция отрисовки чешуек
            function drawScales(opacity = 0.14) {
                ctx.strokeStyle = `rgba(255, 255, 255, ${opacity})`;
                ctx.lineWidth = 1.2;
                const stepX = 16;
                const stepY = 14;
                for (let x = 40; x < 440; x += stepX) {
                    for (let y = 10; y < 246; y += stepY) {
                        const offsetY = (Math.floor(x / stepX) % 2) * (stepY / 2);
                        ctx.beginPath();
                        ctx.arc(x, y + offsetY, 9, -Math.PI * 0.45, Math.PI * 0.45);
                        ctx.stroke();
                    }
                }
            }

            // Функция затемнения спинки и высветления брюшка для объема
            function applyShading() {
                const shade = ctx.createLinearGradient(0, 0, 0, 256);
                shade.addColorStop(0, 'rgba(0, 0, 0, 0.45)');
                shade.addColorStop(0.25, 'rgba(0, 0, 0, 0.0)');
                shade.addColorStop(0.75, 'rgba(255, 255, 255, 0.05)');
                shade.addColorStop(1, 'rgba(255, 245, 220, 0.35)');
                ctx.fillStyle = shade;
                ctx.fillRect(0, 0, 512, 256);
            }

            if (type === 'clown') {
                // Ярко-оранжевая рыба-клоун с белыми полосами в черной обводке (справа внизу на референсе)
                const grad = ctx.createLinearGradient(0, 0, 0, 256);
                grad.addColorStop(0, '#d93800');
                grad.addColorStop(0.4, '#ff5e00');
                grad.addColorStop(0.85, '#ff8811');
                grad.addColorStop(1, '#ffb347');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 512, 256);

                const drawBand = (x, width, curve) => {
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(x - width / 2, 0);
                    ctx.quadraticCurveTo(x + curve, 128, x - width / 2, 256);
                    ctx.lineTo(x + width / 2, 256);
                    ctx.quadraticCurveTo(x + curve + width, 128, x + width / 2, 0);
                    ctx.closePath();
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.lineWidth = 10;
                    ctx.strokeStyle = '#140c08';
                    ctx.stroke();
                    ctx.restore();
                };

                drawBand(135, 42, -15);
                drawBand(265, 52, 25);
                drawBand(405, 34, 10);
                drawScales(0.12);
                applyShading();

            } else if (type === 'yellow_striped') {
                // Желто-золотая рыбка с вертикальными тигровыми полосками (в центре на референсе)
                const grad = ctx.createLinearGradient(0, 0, 0, 256);
                grad.addColorStop(0, '#c27800');
                grad.addColorStop(0.3, '#ffae00');
                grad.addColorStop(0.75, '#ffd000');
                grad.addColorStop(1, '#fff199');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 512, 256);

                ctx.fillStyle = 'rgba(110, 45, 0, 0.58)';
                for (let x = 120; x < 395; x += 28) {
                    ctx.beginPath();
                    ctx.ellipse(x, 128, 7, 92, 0.08, 0, Math.PI * 2);
                    ctx.fill();
                }
                drawScales(0.18);
                applyShading();

            } else if (type === 'magenta_gold') {
                // Розово-пурпурная с лимонной спинкой и грудкой (сверху по центру на референсе)
                const grad = ctx.createLinearGradient(0, 0, 0, 256);
                grad.addColorStop(0, '#d4e81e');
                grad.addColorStop(0.22, '#e04096');
                grad.addColorStop(0.55, '#a82275');
                grad.addColorStop(0.82, '#f59e0b');
                grad.addColorStop(1, '#fef08a');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 512, 256);

                // Полоски
                ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
                for (let x = 140; x < 370; x += 42) {
                    ctx.fillRect(x, 30, 12, 196);
                }
                drawScales(0.2);
                applyShading();

            } else if (type === 'red_neon') {
                // Темно-рубиновая с серебристо-голубой полосой и красным хвостом (слева сверху на референсе)
                const grad = ctx.createLinearGradient(0, 0, 0, 256);
                grad.addColorStop(0, '#1f242d');
                grad.addColorStop(0.35, '#475569');
                grad.addColorStop(0.52, '#cbd5e1');
                grad.addColorStop(0.68, '#dc2626');
                grad.addColorStop(1, '#fca5a5');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 512, 256);

                // Диагональные штрихи
                ctx.strokeStyle = 'rgba(20, 20, 30, 0.5)';
                ctx.lineWidth = 6;
                for (let x = 130; x < 380; x += 22) {
                    ctx.beginPath();
                    ctx.moveTo(x, 40);
                    ctx.lineTo(x + 20, 200);
                    ctx.stroke();
                }

                // Ярко-красная голова и грудка
                const headGrad = ctx.createRadialGradient(70, 165, 10, 90, 150, 110);
                headGrad.addColorStop(0, '#ff2a00');
                headGrad.addColorStop(1, 'rgba(255, 42, 0, 0)');
                ctx.fillStyle = headGrad;
                ctx.fillRect(0, 0, 220, 256);

                drawScales(0.16);
                applyShading();

            } else if (type === 'butterfly') {
                // Оранжево-перламутровая рыба-бабочка с голубыми и алыми полосами (справа сверху на референсе)
                const grad = ctx.createLinearGradient(0, 0, 512, 256);
                grad.addColorStop(0, '#ff6b00');
                grad.addColorStop(0.45, '#ffa726');
                grad.addColorStop(0.7, '#e2e8f0');
                grad.addColorStop(1, '#ff7b00');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 512, 256);

                ctx.strokeStyle = '#0284c7';
                ctx.lineWidth = 10;
                for (let x = 190; x < 380; x += 34) {
                    ctx.beginPath();
                    ctx.moveTo(x, 20);
                    ctx.quadraticCurveTo(x - 20, 128, x, 236);
                    ctx.stroke();
                }
                drawScales(0.18);
                applyShading();

            } else if (type === 'shark') {
                // Хищная серо-синяя акула со светлым брюшком и жаберными щелями
                const grad = ctx.createLinearGradient(0, 0, 0, 256);
                grad.addColorStop(0, '#0f172a');
                grad.addColorStop(0.45, '#334155');
                grad.addColorStop(0.68, '#64748b');
                grad.addColorStop(0.76, '#e2e8f0');
                grad.addColorStop(1, '#f8fafc');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 512, 256);

                // Пять характерных жаберных щелей акулы
                ctx.strokeStyle = 'rgba(15, 23, 42, 0.85)';
                ctx.lineWidth = 4;
                for (let g = 0; g < 5; g++) {
                    const gx = 128 + g * 10;
                    ctx.beginPath();
                    ctx.moveTo(gx, 108);
                    ctx.quadraticCurveTo(gx - 5, 138, gx, 165);
                    ctx.stroke();
                }

                // Хищный оскал у пасти
                ctx.fillStyle = '#1e293b';
                ctx.beginPath();
                ctx.moveTo(15, 165);
                ctx.quadraticCurveTo(55, 152, 88, 174);
                ctx.lineTo(50, 182);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                for (let t = 22; t < 80; t += 8) {
                    ctx.beginPath();
                    ctx.moveTo(t, 163);
                    ctx.lineTo(t + 4, 173);
                    ctx.lineTo(t + 8, 163);
                    ctx.fill();
                }

                applyShading();

            } else {
                // Золотая рыбка (внизу слева на референсе)
                const grad = ctx.createLinearGradient(0, 0, 0, 256);
                grad.addColorStop(0, '#ea580c');
                grad.addColorStop(0.45, '#f97316');
                grad.addColorStop(0.8, '#fbbf24');
                grad.addColorStop(1, '#fef3c7');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 512, 256);

                ctx.fillStyle = 'rgba(180, 50, 0, 0.25)';
                for (let x = 130; x < 380; x += 26) {
                    ctx.fillRect(x, 35, 8, 175);
                }
                drawScales(0.22);
                applyShading();
            }

            // Жаберная крышка для реализма
            ctx.strokeStyle = 'rgba(30, 10, 0, 0.45)';
            ctx.lineWidth = 4.5;
            ctx.beginPath();
            ctx.arc(105, 132, 52, -0.85, 0.95);
            ctx.stroke();

            const tex = new THREE.CanvasTexture(canvas);
            tex.needsUpdate = true;
            return tex;
        }

        // Текстура полупрозрачных плавников с лучами
        function createFinTexture(primaryColor, secondaryColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createLinearGradient(0, 128, 256, 128);
            grad.addColorStop(0, primaryColor);
            grad.addColorStop(0.65, secondaryColor);
            grad.addColorStop(1, 'rgba(255, 255, 255, 0.05)');

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 256, 256);

            // Прожилки плавника
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
            ctx.lineWidth = 2;
            for (let y = 10; y < 246; y += 12) {
                ctx.beginPath();
                ctx.moveTo(0, 128 + (y - 128) * 0.35);
                ctx.lineTo(250, y);
                ctx.stroke();
            }

            const tex = new THREE.CanvasTexture(canvas);
            return tex;
        }

        // ==========================================
        // СОЗДАНИЕ 3D МОДЕЛИ РЫБКИ С ЖИВОЙ АНИМАЦИЕЙ
        // ==========================================
        function createRealisticFish(config) {
            const fishGroup = new THREE.Group();

            // 1. Геометрия тела на основе сферы с анатомической трансформацией
            const bodyGeo = new THREE.SphereGeometry(1, 44, 28);
            const posAttr = bodyGeo.attributes.position;
            const uvAttr = bodyGeo.attributes.uv;

            const L = config.length || 1.65;
            const H = config.height || 0.72;
            const W = config.width || 0.32;

            for (let i = 0; i < posAttr.count; i++) {
                let x = posAttr.getX(i); // от -1 (голова) до +1 (хвост)
                let y = posAttr.getY(i); // от -1 (брюшко) до +1 (спинка)
                let z = posAttr.getZ(i); // толщина

                const u = THREE.MathUtils.clamp((x + 1) * 0.5, 0, 1); // 0 = нос, 1 = основание хвоста

                // Профиль высоты тела рыбы
                let profileY = H;
                if (u < 0.28) {
                    // Заострение к носу
                    profileY = H * Math.pow(Math.max(0, u / 0.28), 0.62) * 0.95 + 0.04;
                } else {
                    // Плавное сужение к хвостовому стеблю
                    const t = Math.max(0, (u - 0.28) / 0.72);
                    profileY = H * (1 - 0.80 * Math.pow(t, 1.35));
                }

                // Профиль толщины тела
                let profileZ = W * Math.sin(Math.pow(u, 0.75) * Math.PI);
                if (u > 0.82) profileZ = Math.max(profileZ, 0.045);

                // Легкая асимметрия спинки и брюшка
                let finalY = y * profileY;
                if (y > 0) finalY *= 1.08;

                posAttr.setXYZ(i, x * (L * 0.5), finalY, z * profileZ);

                // Точный UV-маппинг для боковой текстуры
                const v = THREE.MathUtils.clamp((y + 1) * 0.5, 0, 1);
                uvAttr.setXY(i, u, 1 - v);
            }

            bodyGeo.computeVertexNormals();

            // Сохраним базовые координаты вершин для волнообразного изгиба при плавании
            const basePositions = new Float32Array(posAttr.array.length);
            basePositions.set(posAttr.array);

            const skinTexture = createFishSkinTexture(config.type);
            const bodyMat = new THREE.MeshPhysicalMaterial({
                map: skinTexture,
                roughness: 0.22,
                metalness: 0.08,
                clearcoat: 0.85,
                clearcoatRoughness: 0.15,
                reflectivity: 0.7
            });

            const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
            fishGroup.add(bodyMesh);

            // 2. Плавники (Хвостовой, Спинной, Брюшные, Боковые грудные)
            const finTex = createFinTexture(config.finColor1 || '#ff7700', config.finColor2 || '#ffcc00');
            const finMat = new THREE.MeshPhysicalMaterial({
                map: finTex,
                transparent: true,
                opacity: 0.88,
                roughness: 0.3,
                side: THREE.DoubleSide,
                depthWrite: false
            });

            // Хвостовой плавник (вилкообразный/веерный)
            const tailShape = new THREE.Shape();
            const tailH = H * 0.95;
            const tailL = L * 0.42;
            tailShape.moveTo(0, -0.07);
            tailShape.quadraticCurveTo(tailL * 0.5, -tailH * 0.65, tailL, -tailH);
            tailShape.quadraticCurveTo(tailL * 0.72, 0, tailL, tailH);
            tailShape.quadraticCurveTo(tailL * 0.5, tailH * 0.65, 0, 0.07);
            tailShape.closePath();

            const tailGeo = new THREE.ShapeGeometry(tailShape, 12);
            // Корректировка UV для хвоста
            const tailPos = tailGeo.attributes.position;
            const tailUV = tailGeo.attributes.uv;
            for (let i = 0; i < tailPos.count; i++) {
                tailUV.setXY(i, tailPos.getX(i) / tailL, (tailPos.getY(i) + tailH) / (2 * tailH));
            }
            const tailMesh = new THREE.Mesh(tailGeo, finMat);
            tailMesh.position.set(L * 0.46, 0, 0);
            fishGroup.add(tailMesh);

            // Спинной плавник (для акулы делаем острый высокий треугольный плавник)
            const dorsalShape = new THREE.Shape();
            if (config.type === 'shark') {
                dorsalShape.moveTo(-L * 0.12, 0);
                dorsalShape.quadraticCurveTo(-L * 0.02, H * 1.15, L * 0.14, H * 1.25);
                dorsalShape.quadraticCurveTo(L * 0.06, H * 0.45, L * 0.18, -0.05);
            } else {
                dorsalShape.moveTo(-L * 0.18, 0);
                dorsalShape.quadraticCurveTo(0, H * 0.75, L * 0.32, H * 0.42);
                dorsalShape.quadraticCurveTo(L * 0.25, H * 0.1, L * 0.22, -0.05);
            }
            dorsalShape.closePath();
            const dorsalGeo = new THREE.ShapeGeometry(dorsalShape, 8);
            const dorsalMesh = new THREE.Mesh(dorsalGeo, finMat);
            dorsalMesh.position.set(0.02, H * 0.72, 0);
            fishGroup.add(dorsalMesh);

            // Анальный (нижний) плавник
            const ventralShape = new THREE.Shape();
            ventralShape.moveTo(-L * 0.05, 0);
            ventralShape.quadraticCurveTo(L * 0.12, -H * 0.55, L * 0.28, -H * 0.35);
            ventralShape.lineTo(L * 0.20, 0.05);
            ventralShape.closePath();
            const ventralGeo = new THREE.ShapeGeometry(ventralShape, 6);
            const ventralMesh = new THREE.Mesh(ventralGeo, finMat);
            ventralMesh.position.set(0.08, -H * 0.62, 0);
            fishGroup.add(ventralMesh);

            // Боковые грудные плавники (машут при плавании)
            const pecShape = new THREE.Shape();
            pecShape.moveTo(0, 0);
            pecShape.quadraticCurveTo(L * 0.16, -H * 0.28, L * 0.22, -H * 0.08);
            pecShape.quadraticCurveTo(L * 0.14, H * 0.18, 0, 0.05);
            pecShape.closePath();
            const pecGeo = new THREE.ShapeGeometry(pecShape, 6);

            const pecLeft = new THREE.Mesh(pecGeo, finMat);
            pecLeft.position.set(-L * 0.18, -H * 0.12, W * 0.78);
            pecLeft.rotation.y = 0.45;
            pecLeft.rotation.z = -0.15;
            fishGroup.add(pecLeft);

            const pecRight = new THREE.Mesh(pecGeo, finMat);
            pecRight.position.set(-L * 0.18, -H * 0.12, -W * 0.78);
            pecRight.rotation.y = -0.45;
            pecRight.rotation.z = -0.15;
            fishGroup.add(pecRight);

            // 3. Реалистичные 3D глаза (золотистая радужка + черный глянцевый зрачок)
            const eyeRadius = H * 0.16;
            const irisGeo = new THREE.SphereGeometry(eyeRadius, 16, 16);
            const irisMat = new THREE.MeshStandardMaterial({ color: 0xffd166, roughness: 0.2, metalness: 0.4 });
            const pupilGeo = new THREE.SphereGeometry(eyeRadius * 0.68, 14, 14);
            const pupilMat = new THREE.MeshPhysicalMaterial({ color: 0x050505, roughness: 0.05, clearcoat: 1.0 });

            const createEye = (side) => {
                const eyeGroup = new THREE.Group();
                const iris = new THREE.Mesh(irisGeo, irisMat);
                iris.scale.set(1, 1, 0.6);
                const pupil = new THREE.Mesh(pupilGeo, pupilMat);
                pupil.position.z = side * eyeRadius * 0.35;
                pupil.scale.set(1, 1, 0.65);
                eyeGroup.add(iris, pupil);
                eyeGroup.position.set(-L * 0.33, H * 0.16, side * W * 0.68);
                eyeGroup.rotation.y = side * 0.28;
                return eyeGroup;
            };

            fishGroup.add(createEye(1), createEye(-1));

            // Общий масштаб
            const scale = config.scale || 1.0;
            fishGroup.scale.set(scale, scale, scale);

            return {
                group: fishGroup,
                bodyMesh,
                basePositions,
                tailMesh,
                pecLeft,
                pecRight,
                dorsalMesh,
                length: L,
                speed: config.speed || (1.3 + Math.random() * 0.7),
                phase: Math.random() * Math.PI * 2,
                position: new THREE.Vector3(),
                velocity: new THREE.Vector3((Math.random() - 0.5) * 2, (Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 2).normalize(),
                targetPos: new THREE.Vector3(),
                changeTargetTimer: 0
            };
        }

        // ==========================================
        // КАМНИ, МОХ, ВОДОРОСЛИ И ПУШИСТЫЕ КОРАЛЛЫ
        // ==========================================
        function createSeabedAndRocks() {
            const seabedGroup = new THREE.Group();

            // 1. Песчано-галечная подушка на дне сферы
            const sandGeo = new THREE.SphereGeometry(BOWL_RADIUS * 0.96, 48, 32, 0, Math.PI * 2, Math.PI * 0.73, Math.PI * 0.27);
            const sandMat = new THREE.MeshStandardMaterial({
                color: 0x3b424c,
                roughness: 0.92,
                metalness: 0.05,
                side: THREE.DoubleSide
            });
            const sandCap = new THREE.Mesh(sandGeo, sandMat);
            seabedGroup.add(sandCap);

            // Закрываем верх среза дна неровной поверхностью
            const floorY = -BOWL_RADIUS * Math.cos(Math.PI * 0.27); // около -6.6
            const floorRadius = BOWL_RADIUS * Math.sin(Math.PI * 0.27) * 0.95; // около 7.1
            const topDiskGeo = new THREE.CircleGeometry(floorRadius, 48);
            topDiskGeo.rotateX(-Math.PI / 2);
            const topDisk = new THREE.Mesh(topDiskGeo, new THREE.MeshStandardMaterial({
                color: 0x525b66,
                roughness: 0.95
            }));
            topDisk.position.y = floorY;
            seabedGroup.add(topDisk);

            // 2. Генератор реалистичных камней со мхом (как на картинке)
            function createDetailedRock(radius, isMossy) {
                const geo = new THREE.IcosahedronGeometry(radius, 3);
                const pos = geo.attributes.position;
                const colors = [];

                const seed1 = Math.random() * 10;
                const seed2 = Math.random() * 10;

                for (let i = 0; i < pos.count; i++) {
                    let vx = pos.getX(i);
                    let vy = pos.getY(i);
                    let vz = pos.getZ(i);

                    // Мультичастотный шум для каменных граней
                    const n1 = Math.sin(vx * 1.8 + seed1) * Math.cos(vy * 1.8 + seed2) * Math.sin(vz * 1.8);
                    const n2 = Math.sin(vx * 4.2 + seed2) * Math.cos(vz * 4.2 + seed1) * 0.25;
                    const factor = 1 + n1 * 0.28 + n2 * 0.12;

                    vx *= factor;
                    vy *= factor * 0.72; // чуть сплюснутые валуны
                    vz *= factor;
                    pos.setXYZ(i, vx, vy, vz);

                    // Раскраска вершин: серый гранит + зеленый мох на верхних гранях
                    const normY = vy / radius;
                    const mossChance = normY + n1 * 0.35;
                    if (isMossy && mossChance > 0.22) {
                        // Насыщенный зеленый мох
                        colors.push(0.28 + Math.random() * 0.12, 0.52 + Math.random() * 0.16, 0.12 + Math.random() * 0.08);
                    } else {
                        // Светло-серый и темно-серый камень
                        const shade = 0.52 + n1 * 0.25 + (Math.random() - 0.5) * 0.08;
                        colors.push(shade, shade * 1.02, shade * 1.05);
                    }
                }

                geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
                geo.computeVertexNormals();

                const mat = new THREE.MeshStandardMaterial({
                    vertexColors: true,
                    roughness: 0.88,
                    metalness: 0.06
                });
                return new THREE.Mesh(geo, mat);
            }

            // Крупные валуны по кругу и в центре дна
            const rockConfigs = [
                { x: -3.8, y: -6.1, z: 2.8, r: 1.85, moss: true },
                { x: -1.2, y: -6.2, z: 3.8, r: 1.65, moss: true },
                { x: 1.5, y: -5.9, z: 3.4, r: 2.1, moss: true },
                { x: 4.2, y: -5.8, z: 2.2, r: 1.75, moss: true },
                { x: -5.1, y: -5.5, z: -0.2, r: 1.9, moss: false },
                { x: 5.2, y: -5.4, z: -0.5, r: 2.0, moss: true },
                { x: -3.2, y: -6.0, z: -3.2, r: 1.7, moss: false },
                { x: 0.4, y: -6.2, z: -3.8, r: 1.85, moss: true },
                { x: 3.5, y: -5.9, z: -2.8, r: 1.65, moss: false },
                { x: 0.0, y: -6.3, z: 0.8, r: 1.9, moss: true }
            ];

            rockConfigs.forEach(rc => {
                const rock = createDetailedRock(rc.r, rc.moss);
                rock.position.set(rc.x, rc.y, rc.z);
                rock.rotation.set(Math.random() * 0.5, Math.random() * Math.PI * 2, Math.random() * 0.5);
                seabedGroup.add(rock);
            });

            // 65 мелких камушков (галька) по всему дну
            for (let i = 0; i < 65; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.sqrt(Math.random()) * 6.4;
                const px = Math.cos(angle) * dist;
                const pz = Math.sin(angle) * dist;
                const py = -Math.sqrt(Math.max(1, (BOWL_RADIUS - 0.85) ** 2 - px * px - pz * pz)) + 0.35;

                const pebble = createDetailedRock(0.28 + Math.random() * 0.55, Math.random() > 0.6);
                pebble.position.set(px, Math.max(py, -6.55), pz);
                pebble.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
                seabedGroup.add(pebble);
            }

            return seabedGroup;
        }

        // Создание коралловых кустов и ветвистых золотистых водорослей (как на референсе)
        function createCoralAndFlora() {
            const floraGroup = new THREE.Group();

            // 1. Высокие пушистые золотисто-желтые и розовые водоросли-кораллы
            function createBranchedCoralTree(basePos, height, colorHex, bushiness) {
                const treeGroup = new THREE.Group();
                treeGroup.position.copy(basePos);

                const mat = new THREE.MeshStandardMaterial({
                    color: colorHex,
                    roughness: 0.65,
                    emissive: colorHex,
                    emissiveIntensity: 0.14
                });

                const stemCount = bushiness || 7;
                for (let s = 0; s < stemCount; s++) {
                    const stemAngle = (s / stemCount) * Math.PI * 2 + Math.random() * 0.5;
                    const spread = 0.2 + Math.random() * 0.85;
                    const stemH = height * (0.65 + Math.random() * 0.45);

                    const points = [];
                    const segs = 7;
                    for (let j = 0; j <= segs; j++) {
                        const t = j / segs;
                        const r = spread * Math.pow(t, 0.85);
                        const wx = Math.cos(stemAngle + t * 0.7) * r + Math.sin(t * 4 + s) * 0.22;
                        const wy = t * stemH;
                        const wz = Math.sin(stemAngle + t * 0.7) * r + Math.cos(t * 4 + s) * 0.22;
                        points.push(new THREE.Vector3(wx, wy, wz));
                    }

                    const curve = new THREE.CatmullRomCurve3(points);
                    const tubeGeo = new THREE.TubeGeometry(curve, 16, 0.11, 6, false);
                    const tubeMesh = new THREE.Mesh(tubeGeo, mat);
                    treeGroup.add(tubeMesh);

                    // Пушистые соцветия вдоль стебля для текстуры кораллового куста
                    const frondGeo = new THREE.IcosahedronGeometry(0.24, 1);
                    for (let k = 2; k <= 14; k++) {
                        const pt = curve.getPoint(k / 14);
                        const cluster = new THREE.Mesh(frondGeo, mat);
                        const sc = (1 - (k / 14) * 0.45) * (0.8 + Math.random() * 0.6);
                        cluster.scale.set(sc * 1.2, sc * 0.85, sc * 1.2);
                        cluster.position.set(
                            pt.x + (Math.random() - 0.5) * 0.25,
                            pt.y + (Math.random() - 0.5) * 0.2,
                            pt.z + (Math.random() - 0.5) * 0.25
                        );
                        cluster.rotation.set(Math.random() * 3, Math.random() * 3, 0);
                        treeGroup.add(cluster);
                    }
                }

                corals.push({
                    group: treeGroup,
                    phase: Math.random() * Math.PI * 2,
                    speed: 1.1 + Math.random() * 0.5
                });

                return treeGroup;
            }

            // Левый высокий золотистый коралловый куст (как на фото)
            floraGroup.add(createBranchedCoralTree(new THREE.Vector3(-4.2, -5.6, -0.5), 7.2, 0xeab308, 9));
            // Левый задний сиренево-розовый куст
            floraGroup.add(createBranchedCoralTree(new THREE.Vector3(-5.0, -5.2, -2.5), 6.8, 0xd9779b, 7));
            // Центрально-правый высокий золотистый куст (сквозь который идут пузырьки)
            floraGroup.add(createBranchedCoralTree(new THREE.Vector3(1.5, -5.8, -1.2), 7.8, 0xf59e0b, 8));
            // Правый пышный кораллово-розовый куст
            floraGroup.add(createBranchedCoralTree(new THREE.Vector3(4.8, -5.3, 0.4), 5.6, 0xf47280, 8));

            // 2. Мягкие губчатые кораллы на дне (красно-оранжевые и ярко-желтые шапки)
            function createSpongeMound(pos, radius, colorHex) {
                const moundGroup = new THREE.Group();
                moundGroup.position.copy(pos);

                const mat = new THREE.MeshStandardMaterial({
                    color: colorHex,
                    roughness: 0.75,
                    emissive: colorHex,
                    emissiveIntensity: 0.15
                });

                const blobGeo = new THREE.IcosahedronGeometry(radius * 0.42, 2);
                for (let i = 0; i < 24; i++) {
                    const blob = new THREE.Mesh(blobGeo, mat);
                    const phi = Math.acos(1 - Math.random() * 0.85);
                    const theta = Math.random() * Math.PI * 2;
                    const r = radius * (0.45 + Math.random() * 0.5);
                    blob.position.set(
                        r * Math.sin(phi) * Math.cos(theta),
                        r * Math.cos(phi) * 0.75,
                        r * Math.sin(phi) * Math.sin(theta)
                    );
                    const s = 0.6 + Math.random() * 0.8;
                    blob.scale.set(s, s * 0.85, s);
                    moundGroup.add(blob);
                }

                corals.push({
                    group: moundGroup,
                    phase: Math.random() * Math.PI * 2,
                    speed: 0.8
                });
                return moundGroup;
            }

            // Центральный оранжево-коралловый риф
            floraGroup.add(createSpongeMound(new THREE.Vector3(-0.3, -5.6, 1.4), 2.1, 0xf95738));
            // Левый красный коралл у золотой рыбки
            floraGroup.add(createSpongeMound(new THREE.Vector3(-3.0, -5.8, 2.2), 1.6, 0xe63946));
            // Ярко-желтый коралл справа внизу
            floraGroup.add(createSpongeMound(new THREE.Vector3(3.4, -5.7, 2.3), 1.55, 0xffbe0b));
            // Оранжевый коралл чуть левее центра
            floraGroup.add(createSpongeMound(new THREE.Vector3(-1.6, -5.9, 2.6), 1.25, 0xfb8500));

            // 3. Зеленые ленточные травинки (мягко колышутся в воде)
            const grassColors = [0x4ade80, 0x22c55e, 0x84cc16, 0x10b981];
            for (let i = 0; i < 38; i++) {
                const h = 1.8 + Math.random() * 3.6;
                const w = 0.14 + Math.random() * 0.1;
                const bladeGeo = new THREE.PlaneGeometry(w, h, 1, 10);
                bladeGeo.translate(0, h / 2, 0); // Точка вращения у корня

                // Сужение травинки к верхушке
                const pos = bladeGeo.attributes.position;
                for (let k = 0; k < pos.count; k++) {
                    const py = pos.getY(k);
                    const normY = THREE.MathUtils.clamp(py / h, 0, 1);
                    const taper = 1 - Math.pow(normY, 1.4) * 0.85;
                    pos.setX(k, pos.getX(k) * taper);
                }
                bladeGeo.computeVertexNormals();

                const baseVerts = new Float32Array(pos.array.length);
                baseVerts.set(pos.array);

                const mat = new THREE.MeshStandardMaterial({
                    color: grassColors[i % grassColors.length],
                    roughness: 0.5,
                    side: THREE.DoubleSide
                });

                const blade = new THREE.Mesh(bladeGeo, mat);
                const angle = Math.random() * Math.PI * 2;
                const rad = 1.5 + Math.random() * 4.8;
                blade.position.set(
                    Math.cos(angle) * rad,
                    -6.2,
                    Math.sin(angle) * rad
                );
                blade.rotation.y = Math.random() * Math.PI * 2;

                floraGroup.add(blade);
                seaweeds.push({
                    mesh: blade,
                    baseVerts,
                    height: h,
                    phase: Math.random() * Math.PI * 2,
                    speed: 1.5 + Math.random() * 1.2
                });
            }

            return floraGroup;
        }

        // ==========================================
        // СТЕКЛЯННАЯ СФЕРА С РЕАЛИСТИЧНЫМИ БЛИКАМИ И ВОДНОЙ ГЛАДЬЮ
        // ==========================================
        function createGlassBowl() {
            const bowlGroup = new THREE.Group();

            // 1. Внутренний объем воды (легкое голубое свечение глубины)
            const waterVolumeGeo = new THREE.SphereGeometry(BOWL_RADIUS * 0.975, 64, 48, 0, Math.PI * 2, Math.PI * 0.17, Math.PI * 0.83);
            const waterVolumeMat = new THREE.MeshPhysicalMaterial({
                color: 0x054a68,
                transparent: true,
                opacity: 0.20,
                roughness: 0.1,
                side: THREE.BackSide,
                depthWrite: false
            });
            bowlGroup.add(new THREE.Mesh(waterVolumeGeo, waterVolumeMat));

            // 2. Поверхность воды сверху (мениск на высоте Y = +8.6)
            const waterTopY = BOWL_RADIUS * Math.cos(Math.PI * 0.17);
            const waterTopR = BOWL_RADIUS * Math.sin(Math.PI * 0.17) * 0.975;
            const meniscusGeo = new THREE.RingGeometry(0.01, waterTopR, 64, 4);
            meniscusGeo.rotateX(-Math.PI / 2);
            const meniscusMat = new THREE.MeshPhysicalMaterial({
                color: 0x7dd3fc,
                transparent: true,
                opacity: 0.42,
                roughness: 0.08,
                metalness: 0.1,
                clearcoat: 1.0,
                side: THREE.DoubleSide,
                depthWrite: false
            });
            const meniscus = new THREE.Mesh(meniscusGeo, meniscusMat);
            meniscus.position.y = waterTopY;
            bowlGroup.add(meniscus);

            // Светящийся ободок воды у стекла
            const rimRingGeo = new THREE.TorusGeometry(waterTopR, 0.07, 16, 80);
            rimRingGeo.rotateX(Math.PI / 2);
            const rimRingMat = new THREE.MeshBasicMaterial({
                color: 0xe0f7fa,
                transparent: true,
                opacity: 0.75
            });
            const rimRing = new THREE.Mesh(rimRingGeo, rimRingMat);
            rimRing.position.y = waterTopY;
            bowlGroup.add(rimRing);

            // 3. Внешнее стекло аквариума с эффектом Френеля и бликами
            const glassGeo = new THREE.SphereGeometry(BOWL_RADIUS, 64, 64, 0, Math.PI * 2, Math.PI * 0.11, Math.PI * 0.82);
            const glassMat = new THREE.MeshPhysicalMaterial({
                color: 0xdbeafe,
                transparent: true,
                opacity: 0.24,
                roughness: 0.04,
                metalness: 0.05,
                clearcoat: 1.0,
                clearcoatRoughness: 0.02,
                reflectivity: 1.0,
                side: THREE.FrontSide,
                depthWrite: false
            });
            const glassMesh = new THREE.Mesh(glassGeo, glassMat);
            bowlGroup.add(glassMesh);

            // 4. Фирменный дугообразный белый блик сверху (как на прикрепленной картинке)
            const highlightGeo = new THREE.SphereGeometry(
                BOWL_RADIUS * 0.992,
                48,
                24,
                -Math.PI * 0.35,
                Math.PI * 0.7,
                Math.PI * 0.13,
                Math.PI * 0.12
            );
            const highlightMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.55,
                side: THREE.DoubleSide,
                depthWrite: false
            });
            const highlightArch = new THREE.Mesh(highlightGeo, highlightMat);
            highlightArch.rotation.y = Math.PI * 0.5;
            bowlGroup.add(highlightArch);

            // 5. Стеклянное основание-ножка внизу
            const baseCylinderGeo = new THREE.CylinderGeometry(5.2, 5.8, 0.65, 48);
            const baseGlassMat = new THREE.MeshPhysicalMaterial({
                color: 0x38bdf8,
                transparent: true,
                opacity: 0.45,
                roughness: 0.15,
                metalness: 0.2,
                clearcoat: 1.0
            });
            const baseStand = new THREE.Mesh(baseCylinderGeo, baseGlassMat);
            baseStand.position.y = -BOWL_RADIUS * 0.94;
            bowlGroup.add(baseStand);

            return { bowlGroup, meniscus };
        }

        // ==========================================
        // ПУЗЫРЬКИ ВОЗДУХА (Мелкий поток аэрации + крупные глянцевые пузырьки)
        // ==========================================
        let largeBubbles = [];

        function createBubbles() {
            const bubbleGroup = new THREE.Group();

            // 1. Тысяча мелких пузырьков, поднимающихся со дна (особенно густо справа, как на референсе)
            const count = 900;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);

            for (let i = 0; i < count; i++) {
                const isMainStream = i < 550; // Густая струя у золотистого коралла
                const bx = isMainStream ? (1.6 + (Math.random() - 0.5) * 1.5) : ((Math.random() - 0.5) * 11);
                const bz = isMainStream ? (-1.0 + (Math.random() - 0.5) * 1.5) : ((Math.random() - 0.5) * 11);
                const by = -5.8 + Math.random() * 14.0;

                positions[i * 3] = bx;
                positions[i * 3 + 1] = by;
                positions[i * 3 + 2] = bz;

                bubbleData.push({
                    baseX: bx,
                    baseZ: bz,
                    speed: 2.2 + Math.random() * 2.8,
                    wobble: Math.random() * Math.PI * 2,
                    isMainStream
                });
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            // Круглая текстура с бликом для частиц
            const pCanvas = document.createElement('canvas');
            pCanvas.width = 64;
            pCanvas.height = 64;
            const pCtx = pCanvas.getContext('2d');
            const pGrad = pCtx.createRadialGradient(24, 24, 2, 32, 32, 28);
            pGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            pGrad.addColorStop(0.5, 'rgba(186, 230, 253, 0.75)');
            pGrad.addColorStop(1, 'rgba(186, 230, 253, 0)');
            pCtx.fillStyle = pGrad;
            pCtx.fillRect(0, 0, 64, 64);

            const pMat = new THREE.PointsMaterial({
                size: 0.22,
                map: new THREE.CanvasTexture(pCanvas),
                transparent: true,
                opacity: 0.85,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            bubbleSystem = new THREE.Points(geo, pMat);
            bubbleGroup.add(bubbleSystem);

            // 2. 45 крупных 3D пузырьков воздуха, сплюснутых потоком воды
            const sphereGeo = new THREE.SphereGeometry(0.16, 16, 12);
            const sphereMat = new THREE.MeshPhysicalMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.55,
                roughness: 0.05,
                metalness: 0.1,
                clearcoat: 1.0
            });

            for (let i = 0; i < 45; i++) {
                const bMesh = new THREE.Mesh(sphereGeo, sphereMat);
                const s = 0.6 + Math.random() * 1.3;
                bMesh.scale.set(s * 1.25, s * 0.78, s * 1.25); // Сплюснутая форма настоящего пузырька в воде
                bMesh.position.set(
                    (Math.random() - 0.5) * 11,
                    -5.5 + Math.random() * 13.5,
                    (Math.random() - 0.5) * 11
                );
                bubbleGroup.add(bMesh);
                largeBubbles.push({
                    mesh: bMesh,
                    speed: 1.4 + Math.random() * 1.8,
                    phase: Math.random() * Math.PI * 2
                });
            }

            return bubbleGroup;
        }

        // ==========================================

        // Функция добавления новой рыбки
        function spawnFish(preset) {
            const types = ['clown', 'yellow_striped', 'magenta_gold', 'red_neon', 'butterfly', 'gold'];
            const chosenType = preset?.type || types[Math.floor(Math.random() * types.length)];

            const fishObj = createRealisticFish({
                type: chosenType,
                length: preset?.length || (1.55 + Math.random() * 0.35),
                height: preset?.height || (0.7 + Math.random() * 0.22),
                width: preset?.width || 0.33,
                scale: preset?.scale || (0.85 + Math.random() * 0.25),
                finColor1: preset?.finColor1 || '#ff7b00',
                finColor2: preset?.finColor2 || '#fde047'
            });

            if (preset?.pos) {
                fishObj.position.copy(preset.pos);
            } else {
                fishObj.position.set(
                    (Math.random() - 0.5) * 7,
                    -2 + Math.random() * 5,
                    (Math.random() - 0.5) * 7
                );
            }

            pickNewTargetForFish(fishObj);
            fishObj.group.position.copy(fishObj.position);
            aquariumGroup.add(fishObj.group);
            fishes.push(fishObj);

            const counterEl = document.getElementById('fish-count');
            if (counterEl) counterEl.textContent = fishes.length;
        }

        // Функция запуска или удаления хищной Акулы
        function toggleShark() {
            const btnLabel = document.getElementById('shark-state');
            if (shark) {
                aquariumGroup.remove(shark.group);
                shark = null;
                if (btnLabel) btnLabel.textContent = '+ Акула';

            }

            shark = createRealisticFish({

            pickNewTargetForFish(shark);

        // Эффект пузырьков и всплеска при поедании рыбки акулой
        function createBiteEffect(pos) {
            const group = new THREE.Group();
            group.position.copy(pos);
            const geo = new THREE.SphereGeometry(0.09, 8, 8);
            const mat = new THREE.MeshBasicMaterial({
                color: 0xf87171,
                transparent: true,
                opacity: 0.9
            });

            const particles = [];
            for (let i = 0; i < 14; i++) {
                const p = new THREE.Mesh(geo, mat.clone());
                const vel = new THREE.Vector3(
                    (Math.random() - 0.5) * 3.5,
                    (Math.random() - 0.5) * 3.5,
                    (Math.random() - 0.5) * 3.5
                );
                group.add(p);
                particles.push({ mesh: p, vel });
            }
            aquariumGroup.add(group);
            biteEffects.push({ group, particles, age: 0 });
        }

        // Выбор новой точки назначения внутри безопасной водной зоны сферы
        function pickNewTargetForFish(fish) {
            for (let attempt = 0; attempt < 10; attempt++) {
                const r = 2.0 + Math.random() * (WATER_LIMIT - 2.6);
                const theta = Math.random() * Math.PI * 2;
                const y = -3.4 + Math.random() * 7.8; // Не врезаться в камни на дне и не выпрыгивать из воды
                const horizR = Math.sqrt(Math.max(1, r * r - y * y));
                const tx = Math.cos(theta) * horizR;
                const tz = Math.sin(theta) * horizR;

                if (tx * tx + y * y + tz * tz < (WATER_LIMIT - 0.8) ** 2) {
                    fish.targetPos.set(tx, y, tz);
                    fish.changeTargetTimer = 3.5 + Math.random() * 5.0;
                    return;
                }
            }
            fish.targetPos.set(0, 0.5, 0);
            fish.changeTargetTimer = 4.0;
        }

        // Создание реалистичного извивающегося 3D-червячка (мотыля)
        function createWormMesh() {
            const wormGroup = new THREE.Group();
            const segments = [];
            const segCount = 9;
            const segGeo = new THREE.SphereGeometry(0.11, 12, 10);

            for (let s = 0; s < segCount; s++) {
                // Чередование оттенков сегментов для реалистичного вида червячка
                const isDark = s % 2 === 0;
                const segMat = new THREE.MeshPhysicalMaterial({
                    color: isDark ? 0xdc2626 : 0xf87171,
                    roughness: 0.25,
                    metalness: 0.05,
                    clearcoat: 0.9,
                    emissive: 0x991b1b,
                    emissiveIntensity: 0.35
                });
                const seg = new THREE.Mesh(segGeo, segMat);
                // Сужение к кончикам червячка
                const taper = Math.sin(((s + 0.8) / (segCount + 0.6)) * Math.PI);
                const radiusScale = 0.55 + taper * 0.65;
                seg.scale.set(radiusScale, 0.85, radiusScale);
                seg.position.y = (s - segCount / 2) * 0.11;
                wormGroup.add(seg);
                segments.push(seg);
            }

            return { wormGroup, segments };
        }

        // Покормить рыбок (появляются от 1 до 3 червячков)
        function dropFishFood(customPos) {
            const count = Math.floor(Math.random() * 3) + 1; // Строго от 1 до 3 червячков

            for (let i = 0; i < count; i++) {
                const { wormGroup, segments } = createWormMesh();
                const startX = (customPos ? customPos.x : 0) + (Math.random() - 0.5) * 4.2;
                const startZ = (customPos ? customPos.z : 0) + (Math.random() - 0.5) * 4.2;
                const startY = 6.2 + Math.random() * 0.8;

                wormGroup.position.set(startX, startY, startZ);
                wormGroup.rotation.set(
                    (Math.random() - 0.5) * 0.8,
                    Math.random() * Math.PI * 2,
                    (Math.random() - 0.5) * 0.8
                );

                // Легкий всплеск колечка на воде при падении червячка
                const rippleGeo = new THREE.RingGeometry(0.1, 0.45, 24);
                rippleGeo.rotateX(-Math.PI / 2);
                const rippleMat = new THREE.MeshBasicMaterial({
                    color: 0xbae6fd,
                    transparent: true,
                    opacity: 0.7,
                    side: THREE.DoubleSide
                });
                const ripple = new THREE.Mesh(rippleGeo, rippleMat);
                ripple.position.set(startX, 8.1, startZ);
                aquariumGroup.add(ripple);
                setTimeout(() => aquariumGroup.remove(ripple), 600);

                aquariumGroup.add(wormGroup);
                foodParticles.push({
                    mesh: wormGroup,
                    segments,
                    velY: -(0.55 + Math.random() * 0.25), // Медленно тонут, чтобы рыбки успевали схватить
                    wobble: Math.random() * Math.PI * 2,
                    wiggleSpeed: 9.0 + Math.random() * 4.0
                });
            }

            const word = count === 1 ? 'червячок' : 'червячка';
            showToast(`🪱 Брошено в воду: ${count} ${word}!`);
        }

        // ==========================================
        // АНИМАЦИОННЫЙ ЦИКЛ (Физика рыбок, плавников, травы и пузырьков)
        // ==========================================
        const clock = new THREE.Clock();
        const dummyTarget = new THREE.Object3D();

        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.05);
            const elapsed = clock.getElapsedTime();

            // 1. Плавное обновление камеры
            if (autoRotate && !isDragging) {
                targetSpherical.theta += dt * 0.08;
            }
            spherical.theta += (targetSpherical.theta - spherical.theta) * 0.08;
            spherical.phi += (targetSpherical.phi - spherical.phi) * 0.08;
            spherical.radius += (targetSpherical.radius - spherical.radius) * 0.1;

            camera.position.x = spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta);
            camera.position.y = spherical.radius * Math.cos(spherical.phi);
            camera.position.z = spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta);
            camera.lookAt(0, -0.4, 0);

            // 2. Анимация извивающихся червячков
            for (let i = foodParticles.length - 1; i >= 0; i--) {
                const fp = foodParticles[i];
                // Если червячок еще не упал на самое дно, он плавно опускается
                if (fp.mesh.position.y > -4.8) {
                    fp.mesh.position.y += fp.velY * dt;
                    fp.mesh.position.x += Math.sin(elapsed * 2.2 + fp.wobble) * 0.012;
                    fp.mesh.position.z += Math.cos(elapsed * 1.9 + fp.wobble) * 0.012;
                    fp.mesh.rotation.y += dt * 0.8;
                }

                // Реалистичное извивание сегментов червячка в воде
                if (fp.segments) {
                    for (let s = 0; s < fp.segments.length; s++) {
                        const seg = fp.segments[s];
                        const wave = elapsed * fp.wiggleSpeed + fp.wobble + s * 0.65;
                        seg.position.x = Math.sin(wave) * 0.12;
                        seg.position.z = Math.cos(wave * 0.85) * 0.08;
                    }
                }
            }

            // 3. Реалистичное поведение и биомеханика рыбок
            fishes.forEach((fish, idx) => {
                fish.changeTargetTimer -= dt;

                // Если есть червячки в воде, рыбки замечают их из любой точки аквариума и плывут есть
                let chasingFood = false;
                if (foodParticles.length > 0) {
                    let minDist = Infinity;
                    let closestFood = null;
                    for (let f = 0; f < foodParticles.length; f++) {
                        const d = fish.position.distanceTo(foodParticles[f].mesh.position);
                        if (d < minDist) {
                            minDist = d;
                            closestFood = foodParticles[f];
                        }
                    }
                    if (closestFood) {
                        fish.targetPos.copy(closestFood.mesh.position);
                        chasingFood = true;
                        // Рыбка подплыла и съела червячка
                        if (minDist < 1.15) {
                            aquariumGroup.remove(closestFood.mesh);
                            const foodIdx = foodParticles.indexOf(closestFood);
                            if (foodIdx !== -1) foodParticles.splice(foodIdx, 1);
                            pickNewTargetForFish(fish);
                            chasingFood = false;
                        }
                    }
                }

                if (!chasingFood && (fish.changeTargetTimer <= 0 || fish.position.distanceTo(fish.targetPos) < 1.2)) {
                    pickNewTargetForFish(fish);
                }

                // Желаемый вектор движения к цели
                const desiredDir = new THREE.Vector3().subVectors(fish.targetPos, fish.position).normalize();

                // Избегание столкновений со стеклом сферы и дном
                const distFromCenter = fish.position.length();
                if (distFromCenter > WATER_LIMIT - 0.8) {
                    const pushInward = fish.position.clone().normalize().multiplyScalar(-1.8);
                    desiredDir.add(pushInward).normalize();
                }
                if (!chasingFood && fish.position.y < -3.8) {
                    desiredDir.y += 0.9;
                    desiredDir.normalize();
                }
                if (!chasingFood && fish.position.y > 4.6) {
                    desiredDir.y -= 0.9;
                    desiredDir.normalize();
                }

                // Мягкое отталкивание рыбок друг от друга (ослабляется во время охоты за червячком)
                for (let j = 0; j < fishes.length; j++) {
                    if (idx === j) continue;
                    const other = fishes[j];
                    const dist = fish.position.distanceTo(other.position);
                    const minSep = chasingFood ? 0.85 : 1.65;
                    if (dist < minSep && dist > 0.001) {
                        const repelForce = chasingFood ? 0.35 : 0.8;
                        const repel = new THREE.Vector3().subVectors(fish.position, other.position).normalize().multiplyScalar(repelForce / dist);
                        desiredDir.add(repel).normalize();
                    }
                }

                // Ограничение вертикального наклона (во время погони за червячком рыбки могут круто пикировать вверх/вниз)
                const maxVerticalAngle = chasingFood ? 0.88 : 0.42;
                desiredDir.y = THREE.MathUtils.clamp(desiredDir.y, -maxVerticalAngle, maxVerticalAngle);
                desiredDir.normalize();

                // Плавный поворот вектора скорости
                const turnRate = chasingFood ? 5.5 : 2.1;
                fish.velocity.lerp(desiredDir, dt * turnRate).normalize();

                const activeSpeed = chasingFood ? fish.speed * 2.1 : fish.speed;
                fish.position.addScaledVector(fish.velocity, activeSpeed * dt);
                fish.group.position.copy(fish.position);

                // Ориентация 3D модели рыбки вдоль траектории движения (голова у нас по -X)
                const lookPoint = fish.position.clone().add(fish.velocity);
                dummyTarget.position.copy(fish.position);
                dummyTarget.lookAt(lookPoint);
                // Поворот на +90 градусов по Y переводит ось -X (нос рыбки) в направление взгляда +Z
                const alignQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI / 2);
                dummyTarget.quaternion.multiply(alignQuat);
                fish.group.quaternion.slerp(dummyTarget.quaternion, dt * 6.5);

                // Живой волнообразный изгиб позвоночника рыбки (S-образная волна от головы к хвосту)
                const swimFreq = chasingFood ? 14.0 : 8.2;
                const swimPhase = elapsed * swimFreq + fish.phase;
                const posAttr = fish.bodyMesh.geometry.attributes.position;
                const base = fish.basePositions;
                const halfL = fish.length * 0.5;

                for (let v = 0; v < posAttr.count; v++) {
                    const bx = base[v * 3];
                    const by = base[v * 3 + 1];
                    const bz = base[v * 3 + 2];

                    // u = 0 у носа, u = 1 у хвоста
                    const u = THREE.MathUtils.clamp((bx + halfL) / fish.length, 0, 1);
                    const waveAmp = Math.pow(u, 1.55) * 0.16;
                    const waveOffset = Math.sin(swimPhase - u * 4.5) * waveAmp;

                    posAttr.setZ(v, bz + waveOffset);
                }
                posAttr.needsUpdate = true;

                // Движение хвостового и грудных плавников в такт телу
                const tailOffsetZ = Math.sin(swimPhase - 4.2) * 0.15;
                fish.tailMesh.position.z = tailOffsetZ;
                fish.tailMesh.rotation.y = Math.cos(swimPhase - 4.0) * 0.38;

                fish.pecLeft.rotation.y = 0.45 + Math.sin(swimPhase * 1.3) * 0.28;
                fish.pecRight.rotation.y = -0.45 - Math.sin(swimPhase * 1.3) * 0.28;
            });

            // 3.1 Поведение хищной Акулы (каждые 5 секунд съедает одну рыбку)
            if (shark) {
                let targetVictim = null;

                if (fishes.length > 0) {
                    shark.eatTimer += dt;

                    // Ищем ближайшую рыбку для преследования
                    let minDist = Infinity;
                    let victimIdx = -1;
                    for (let i = 0; i < fishes.length; i++) {
                        const d = shark.position.distanceTo(fishes[i].position);
                        if (d < minDist) {
                            minDist = d;
                            victimIdx = i;
                        }
                    }

                    if (victimIdx !== -1) {
                        targetVictim = fishes[victimIdx];
                        shark.targetPos.copy(targetVictim.position);

                        // Каждые 5 секунд акула совершает бросок и съедает рыбку
                        if (shark.eatTimer >= 5.0) {
                            shark.eatTimer -= 5.0;

                            // Перемещаем акулу ближе к жертве в момент броска и съедаем рыбку
                            constvictimPos = targetVictim.position.clone();
                            shark.position.lerp(constvictimPos, 0.65);
                            createBiteEffect(constvictimPos);

                            aquariumGroup.remove(targetVictim.group);
                            fishes.splice(victimIdx, 1);

                            const counterEl = document.getElementById('fish-count');
                            if (counterEl) counterEl.textContent = fishes.length;

                            showToast(`🦈 Акула съела рыбку! Осталось рыбок: ${fishes.length}`);
                        }
                    }
                } else {
                    // Если всех рыбок съели, акула свободно патрулирует аквариум
                    shark.eatTimer = 0;
                    shark.changeTargetTimer -= dt;
                    if (shark.changeTargetTimer <= 0 || shark.position.distanceTo(shark.targetPos) < 1.5) {
                        pickNewTargetForFish(shark);
                    }
                }

                const desiredDir = new THREE.Vector3().subVectors(shark.targetPos, shark.position).normalize();
                const distFromCenter = shark.position.length();
                if (distFromCenter > WATER_LIMIT - 1.0) {
                    const pushInward = shark.position.clone().normalize().multiplyScalar(-2.0);
                    desiredDir.add(pushInward).normalize();
                }

                // Когда таймер подходит к 5 секундам, акула резко ускоряется к жертве
                const isLunging = fishes.length > 0 && shark.eatTimer > 3.6;
                const turnSpeed = isLunging ? 6.0 : 2.8;
                const moveSpeed = isLunging ? shark.speed * 1.85 : shark.speed;

                desiredDir.y = THREE.MathUtils.clamp(desiredDir.y, -0.75, 0.75);
                desiredDir.normalize();

                shark.velocity.lerp(desiredDir, dt * turnSpeed).normalize();
                shark.position.addScaledVector(shark.velocity, moveSpeed * dt);
                shark.group.position.copy(shark.position);

                const lookPoint = shark.position.clone().add(shark.velocity);
                dummyTarget.position.copy(shark.position);
                dummyTarget.lookAt(lookPoint);
                const alignQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI / 2);
                dummyTarget.quaternion.multiply(alignQuat);
                shark.group.quaternion.slerp(dummyTarget.quaternion, dt * 7.0);

                // Анимация мощного изгиба тела и хвоста акулы
                const swimFreq = isLunging ? 13.5 : 7.5;
                const swimPhase = elapsed * swimFreq + shark.phase;
                const posAttr = shark.bodyMesh.geometry.attributes.position;
                const base = shark.basePositions;
                const halfL = shark.length * 0.5;

                for (let v = 0; v < posAttr.count; v++) {
                    const bx = base[v * 3];
                    const bz = base[v * 3 + 2];
                    const u = THREE.MathUtils.clamp((bx + halfL) / shark.length, 0, 1);
                    const waveAmp = Math.pow(u, 1.5) * 0.22;
                    const waveOffset = Math.sin(swimPhase - u * 4.5) * waveAmp;
                    posAttr.setZ(v, bz + waveOffset);
                }
                posAttr.needsUpdate = true;

                shark.tailMesh.position.z = Math.sin(swimPhase - 4.2) * 0.22;
                shark.tailMesh.rotation.y = Math.cos(swimPhase - 4.0) * 0.42;
                shark.pecLeft.rotation.y = 0.45 + Math.sin(swimPhase * 1.1) * 0.18;
                shark.pecRight.rotation.y = -0.45 - Math.sin(swimPhase * 1.1) * 0.18;
            }

            // Анимация всплеска после укуса акулы
            for (let i = biteEffects.length - 1; i >= 0; i--) {
                const be = biteEffects[i];
                be.age += dt;
                if (be.age > 0.8) {
                    aquariumGroup.remove(be.group);
                    biteEffects.splice(i, 1);
                    continue;
                }
                be.particles.forEach(p => {
                    p.mesh.position.addScaledVector(p.vel, dt);
                    p.mesh.material.opacity = Math.max(0, 1 - be.age / 0.8);
                });
            }

            // 4. Анимация колышущихся водорослей и кораллов
            seaweeds.forEach(sw => {
                const posAttr = sw.mesh.geometry.attributes.position;
                const base = sw.baseVerts;
                for (let i = 0; i < posAttr.count; i++) {
                    const bx = base[i * 3];
                    const by = base[i * 3 + 1];
                    const bz = base[i * 3 + 2];
                    const normY = THREE.MathUtils.clamp(by / sw.height, 0, 1);
                    const factor = Math.pow(normY, 1.4);
                    const swayX = Math.sin(elapsed * sw.speed + sw.phase + by * 0.9) * 0.32 * factor;
                    const swayZ = Math.cos(elapsed * (sw.speed * 0.8) + sw.phase + by * 0.7) * 0.22 * factor;
                    posAttr.setXYZ(i, bx + swayX, by, bz + swayZ);
                }
                posAttr.needsUpdate = true;
            });

            corals.forEach(c => {
                c.group.rotation.z = Math.sin(elapsed * c.speed + c.phase) * 0.035;
                c.group.rotation.x = Math.cos(elapsed * (c.speed * 0.8) + c.phase) * 0.025;
            });

            // 5. Анимация мелких и крупных пузырьков воздуха
            if (bubbleSystem) {
                bubbleSystem.visible = bubbleIntensity > 0;
                if (bubbleIntensity > 0) {
                    const bPos = bubbleSystem.geometry.attributes.position;
                    const speedMult = bubbleIntensity === 2 ? 1.0 : 0.55;

                    for (let i = 0; i < bubbleData.length; i++) {
                        const bd = bubbleData[i];
                        let py = bPos.getY(i) + bd.speed * speedMult * dt;
                        let px = bd.baseX + Math.sin(elapsed * 3.5 + bd.wobble + py * 0.6) * 0.18;
                        let pz = bd.baseZ + Math.cos(elapsed * 3.0 + bd.wobble + py * 0.6) * 0.18;

                        // Если пузырек достиг поверхности воды (Y = 8.4) или вышел за радиус сферы
                        if (py > 8.3 || (px * px + py * py + pz * pz > (BOWL_RADIUS - 0.5) ** 2)) {
                            py = -5.6;
                        }
                        bPos.setXYZ(i, px, py, pz);
                    }
                    bPos.needsUpdate = true;
                }
            }

            largeBubbles.forEach((lb, idx) => {
                lb.mesh.visible = bubbleIntensity > 0 && (bubbleIntensity === 2 || idx % 2 === 0);
                if (!lb.mesh.visible) return;
                lb.mesh.position.y += lb.speed * dt;
                lb.mesh.position.x += Math.sin(elapsed * 4 + lb.phase) * 0.012;
                if (lb.mesh.position.y > 8.2 || lb.mesh.position.length() > BOWL_RADIUS - 0.6) {
                    lb.mesh.position.y = -5.4;
                    lb.mesh.position.x = (Math.random() - 0.5) * 9;
                    lb.mesh.position.z = (Math.random() - 0.5) * 9;
                }
            });

            // Легкая рябь водной глади сверху
            if (waterMeniscus) {
                waterMeniscus.position.y = BOWL_RADIUS * Math.cos(Math.PI * 0.17) + Math.sin(elapsed * 2.2) * 0.03;
            }

            renderer.render(scene, camera);
        }

        // ==========================================
        // ИНТЕРАКТИВНОСТЬ И КНОПКА СКАЧИВАНИЯ ФАЙЛА
        // ==========================================
        function setupInteractions() {
            const dom = renderer.domElement;

            // Вращение мышью
            dom.addEventListener('mousedown', (e) => {
                isDragging = true;
                prevMouse = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - prevMouse.x;
                const dy = e.clientY - prevMouse.y;
                targetSpherical.theta -= dx * 0.0065;
                targetSpherical.phi = THREE.MathUtils.clamp(targetSpherical.phi - dy * 0.0055, 0.45, Math.PI * 0.62);
                prevMouse = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
            });

            // Сенсорное управление для телефонов и планшетов
            dom.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isDragging = true;
                    prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (!isDragging || e.touches.length !== 1) return;
                const dx = e.touches[0].clientX - prevMouse.x;
                const dy = e.touches[0].clientY - prevMouse.y;
                targetSpherical.theta -= dx * 0.0065;
                targetSpherical.phi = THREE.MathUtils.clamp(targetSpherical.phi - dy * 0.0055, 0.45, Math.PI * 0.62);
                prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }, { passive: true });

            window.addEventListener('touchend', () => {
                isDragging = false;
            });

            // Зум колесиком мыши
            dom.addEventListener('wheel', (e) => {
                e.preventDefault();
                targetSpherical.radius = THREE.MathUtils.clamp(targetSpherical.radius + e.deltaY * 0.015, 16, 40);
            }, { passive: false });

            // Двойной клик по аквариуму — бросить корм
            dom.addEventListener('dblclick', () => {
                dropFishFood();
            });

            // Кнопки интерфейса
            document.getElementById('btn-feed').addEventListener('click', () => {
                dropFishFood();
            });

            document.getElementById('btn-add-fish').addEventListener('click', () => {
                if (fishes.length < 24) {
                    spawnFish();
                } else {
                    showToast('В аквариуме уже максимум рыбок (24)!');
                }
            });

            document.getElementById('btn-shark').addEventListener('click', () => {
                toggleShark();
            });

            document.getElementById('btn-bubbles').addEventListener('click', () => {
                bubbleIntensity = (bubbleIntensity + 1) % 3;
                const labels = ['Выкл', 'Норма', 'Макс'];
                document.getElementById('bubble-state').textContent = labels[bubbleIntensity];
            });

            document.getElementById('btn-light').addEventListener('click', () => {
                lightingMode = (lightingMode + 1) % 3;
                const labelEl = document.getElementById('light-state');
                const container = document.getElementById('canvas-container');

                if (lightingMode === 0) {
                    labelEl.textContent = 'День';
                    ambientLight.color.setHex(0x1e4e79);
                    topLight.color.setHex(0xe0f7fa);
                    bottomGlowLight.color.setHex(0x00b4d8);
                    container.style.background = 'radial-gradient(circle at 50% 45%, #0c2b4e 0%, #041022 55%, #01050c 100%)';
                } else if (lightingMode === 1) {
                    labelEl.textContent = 'Риф-Неон';
                    ambientLight.color.setHex(0x3b0764);
                    topLight.color.setHex(0x38bdf8);
                    bottomGlowLight.color.setHex(0xf43f5e);
                    container.style.background = 'radial-gradient(circle at 50% 45%, #1e1040 0%, #090518 55%, #020108 100%)';
                } else {
                    labelEl.textContent = 'Золотой Закат';
                    ambientLight.color.setHex(0x451a03);
                    topLight.color.setHex(0xfde68a);
                    bottomGlowLight.color.setHex(0xf97316);
                    container.style.background = 'radial-gradient(circle at 50% 45%, #3b1d11 0%, #140906 55%, #050201 100%)';
                }
            });

            // Кнопка скачивания самодостаточного HTML-файла
            document.getElementById('btn-download').addEventListener('click', () => {
                const fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
                const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = '3d_realistic_aquarium.html';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                showToast('Файл 3d_realistic_aquarium.html скачивается!');
            });

            window.addEventListener('resize', onWindowResize);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 3000);
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = function () {
            initAquarium();
            animate();
        };
    </script>
